ci_checks:
  # ---------------- Уникальность и целостность ----------------
  - id: unique_text_keys
    source: И4
    what: "Уникальность text_key в text_registry (RISK-L-16)"
    command: "grep -R 'text_key:' architecture/**/*.md | sort | uniq -d | test $(wc -l) -eq 0"

  - id: command_role_match
    source: Б17
    what: "Каждая команда в config/commands/*.yaml имеет запись в role_capability_matrix"
    command: "TODO"

  - id: no_free_text_shadow_reason
    source: И1
    what: "Причины теневой паузы — только enum, без свободного текста"
    command: "TODO: исправить regex [^enum] (D-19)"

  - id: age_gate_before_pid
    source: ADD3 ERRATA
    what: "pid не создаётся до жёсткой проверки даты рождения (INV-AGE-GATE-BEFORE-PID)"
    command: "TODO"

  - id: outbox_sent_at_compaction
    source: ADD1 ERRATA + И2
    what: "Компакция outbox с sent_at (INV-OUTBOX-SENT-AT-COMPACTION)"
    command: "TODO"

  # ---------------- Роли и доступы ----------------
  - id: single_writer_participant_state
    source: E1 ERRATA
    what: "Единственный писатель participant_state — роль participant_state_projector"
    command: "psql -c '\\dp participant_state' | grep -c INSERT | test $(...) -eq 1"

  # ---------------- Тексты ----------------
  - id: no_pre_legal_review_in_prod
    source: prod_launch_gate (И1)
    what: "Прод не стартует, пока есть legal_status: pre-legal-review"
    command: "TODO"

    - id: no_place_command
    source: v3.1
    what: "Ни одного упоминания /place как действующей команды (исторические справки разрешены)"
    excluded_files:
      - architecture/12-reserve.md                        # §12.3 — сам факт удаления
      - architecture/README.md                            # реестр 1.10, строка резерва
      - architecture/appendix/A-patch1-global-rules.md     # P-6 удалён
      - architecture/appendix/B-failsafe-registry.md       # снятие примера place
      - architecture/appendix/C-registries.md              # снятие строки парковки
      - architecture/_WIP-architecture-split.md            # служебный журнал нарезки
    command: "bash tools/checks.sh"
    implemented_in: "tools/checks.sh, проверка 2"


  # ---------------- Аудит ----------------
  - id: audit_no_csv_export
    source: Б17
    what: "Экспорт /audit запрещён в CSV"
    command: "TODO"

  - id: graph_k_anonymity
    source: И4
    what: "/graph требует k >= 5 (защита от атаки пересечением)"
    command: "TODO"

  # ---------------- Ссылочная целостность каталога ----------------
  - id: no_broken_links
    source: этот отчёт
    what: "Ни одной висячей относительной ссылки в architecture/"
    command: "markdown-link-check architecture/**/*.md"

    - id: errata_backrefs_present
    source: этот отчёт
    what: "Все файлы корпуса + И3 несут врезку «Переопределено/Уточнено ERRATA-UNIFIED»"
    command: "bash tools/checks.sh"
    implemented_in: "tools/checks.sh, проверка 4"

      - id: precedence_single_source
    source: этот отчёт
    what: "Ступень старшинства объявлена только в normative/README.md; остальные файлы её цитируют со ссылкой на канон"
    rule: "файл, содержащий цепочку «И1 → И2 → И3», обязан содержать строку «Канонический источник старшинства»"
    forbidden_phrase: "ниже в цепочке старшинства"
    command: "bash tools/checks.sh"
    implemented_in: "tools/checks.sh, проверки 6 и 7"

